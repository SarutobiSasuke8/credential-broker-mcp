name: mcp-eval

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Pinned to the harness v1 PR head; repin to the merged main SHA after
      # mcp-eval-harness PRs #5 and #6 merge (change package.json in the same PR).
      - uses: SarutobiSasuke8/mcp-eval-harness@077c74a60ccd6d9061e35f882ffd3db5f5d17052
        with:
          suite: eval/mcp.suite.yaml
          node-version: "" # setup-node already ran above
