name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  platform-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=low
      - run: npm run verify:pack
      - run: npm run test:e2e

  # Preserve the status name required by the repository ruleset. The matrix
  # must succeed in full; failed, cancelled or skipped runs cannot pass it.
  check:
    needs: platform-check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform check
        env:
          PLATFORM_RESULT: ${{ needs.platform-check.result }}
        run: test "$PLATFORM_RESULT" = success
