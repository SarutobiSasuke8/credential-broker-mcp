name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  platform-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=low
      - run: npm run verify:pack
      - run: npm run test:e2e

  # Preserve the status name required by the repository ruleset. The matrix
  # must succeed in full; failed, cancelled or skipped runs cannot pass it.
  check:
    needs: platform-check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform check
        env:
          PLATFORM_RESULT: ${{ needs.platform-check.result }}
        run: test "$PLATFORM_RESULT" = success

  # Report floating runtime references (unpinned base images, engines.node
  # ranges, action tags, git deps without a commit SHA). Report mode: warns and
  # writes a step summary, never fails. Flip to failing with `--strict`.
  # See docs/runtime-pins.md.
  pin-check:
    name: pin-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report floating references
        run: node scripts/pin-check.mjs
