<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Credential Broker</title>
<link rel="stylesheet" href="/ui/app.css" nonce="__NONCE__">
</head>
<body>
<a class="skip" href="#page">Skip to content</a>
<header class="top" id="top">
  <button id="menuBtn" class="btn icon menu" type="button" aria-label="Pages" aria-expanded="false" aria-controls="tabs">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="brand" href="#/overview" aria-label="Credential Broker, overview">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 20 3m-4 4 3 3m-6-1 2 2"/></svg></span>
    <span class="brand-name">Credential Broker</span>
  </a>
  <nav class="nav" aria-label="Pages" id="tabs">
    <a href="#/overview" data-page="overview">Overview</a>
    <a href="#/keys" data-page="keys">Keys</a>
    <a href="#/agents" data-page="agents">Agents</a>
    <a href="#/approvals" data-page="approvals">Approvals</a>
    <a href="#/activity" data-page="activity">Activity</a>
    <a href="#/import" data-page="import">Import</a>
    <a href="#/settings" data-page="settings">Settings</a>
  </nav>
  <div class="search" id="searchWrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="Search keys, agents, approvals, providers" aria-label="Search keys, agents, approvals and providers" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="searchResults" aria-autocomplete="list">
    <kbd class="search-kbd" aria-hidden="true">/</kbd>
    <div id="searchResults" class="results" role="listbox" aria-label="Search results" hidden></div>
  </div>
  <div class="top-actions">
    <span id="statusChip" class="chip live" role="status">All access live</span>
    <button id="pauseBtn" class="btn panic" type="button" title="Stops every agent request on its next call. Nothing is deleted. Asks you to type PAUSE.">Pause all access</button>
    <button id="newKey" class="btn primary" type="button">New key</button>
    <button id="theme" class="btn icon" type="button" aria-label="Switch theme" title="Switch between light, dark and system">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg>
    </button>
  </div>
</header>
<div id="banners" class="banners"></div>
<main id="page" class="page" tabindex="-1"></main>
<div id="drawerHost"></div>
<div id="modalHost"></div>
<div class="toasts" id="toasts"></div>
<div class="sr-only" id="live" aria-live="assertive" role="status"></div>
<script type="module" src="/ui/app.js" nonce="__NONCE__"></script>
</body>
</html>
